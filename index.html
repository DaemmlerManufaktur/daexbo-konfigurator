<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAEXBO Van Konfigurator</title>
<style>
body{margin:0;padding:16px;background:#f5f3ed;font-family:Arial,sans-serif}
#dx-config{color:#203e35;background:#f5f3ed;padding:20px;border-radius:12px;max-width:1100px;margin:auto}
#dx-config *{box-sizing:border-box}#dx-config h2{margin:0 0 8px}#dx-config .dx-intro{margin:0 0 18px}
#dx-config .dx-nav{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
#dx-config button{cursor:pointer;border:1px solid #bdc8b5;background:white;color:#203e35;border-radius:7px;padding:10px 13px;font-size:14px}
#dx-config button:focus-visible{outline:3px solid #86a87b;outline-offset:2px}
#dx-config button.dx-active,#dx-config button.dx-picked,#dx-config button.dx-main{background:#203e35;color:white;border-color:#203e35}
#dx-config button:disabled{cursor:default;opacity:.55}
#dx-config .dx-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,1fr);gap:18px}
#dx-config .dx-card,#dx-config .dx-summary{background:white;border-radius:9px;padding:16px;margin-bottom:12px;border:1px solid #e1e7dc}
#dx-config .dx-card h4{margin:0 0 7px}#dx-config .dx-card p{margin:0 0 12px;color:#53645c;font-size:14px}
#dx-config .dx-price{font-size:16px;font-weight:bold;color:#203e35;margin:8px 0}
#dx-config .dx-price small{font-size:11px;font-weight:normal;color:#777}
#dx-config .dx-thumb{background:#e7ecdf;min-height:110px;display:flex;align-items:center;justify-content:center;color:#6d8074;font-size:13px;margin-bottom:12px;border-radius:6px;overflow:hidden}
#dx-config .dx-thumb img{width:100%;height:160px;object-fit:contain;background:white}
#dx-config .dx-summary{position:sticky;top:12px}#dx-config .dx-summary ul{padding-left:18px;font-size:14px;line-height:1.7}
#dx-config .dx-foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
#dx-config .dx-count{font-size:14px;color:#203e35;line-height:1.7}
#dx-config .dx-included{font-size:12px;color:#356c46;font-weight:bold;margin:7px 0}
#dx-config .dx-package{border:2px solid #799b80}
#dx-config .dx-package-list{margin:8px 0 12px;padding-left:19px;color:#53645c;font-size:13px;line-height:1.6}
#dx-config .dx-total-row{display:flex;justify-content:space-between;gap:8px}
#dx-config .dx-total-final{font-size:17px;font-weight:bold;border-top:1px solid #e1e7dc;padding-top:8px;margin-top:6px}
@media(max-width:700px){#dx-config .dx-layout{grid-template-columns:1fr}#dx-config .dx-summary{position:static}}
</style>
</head>
<body>
<div id="dx-config">
<h2>DAEXBO Van Konfigurator</h2>
<p class="dx-intro">Stelle deinen modularen Ausbau zusammen. Alle hinterlegten Preise verstehen sich inklusive 19 % MwSt.; weitere Positionen auf Anfrage.</p>
<div id="dx-nav" class="dx-nav"></div>
<div class="dx-layout">
 <div>
  <h3 id="dx-heading"></h3>
  <div id="dx-items"></div>
  <div class="dx-foot"><button type="button" id="dx-back" onclick="dxStep(-1)">Zurück</button><button type="button" id="dx-next" class="dx-main" onclick="dxStep(1)">Weiter</button></div>
 </div>
 <aside><div class="dx-summary"><h3>Deine Konfiguration</h3><div id="dx-summary">Noch keine Auswahl.</div><div class="dx-count" id="dx-total"></div><button type="button" class="dx-main" onclick="dxMail()">Konfiguration anfragen</button><p style="font-size:12px;color:#64756a">Es wird eine E-Mail mit deiner Auswahl vorbereitet.</p></div></aside>
</div>
</div>
<script>
/* PRODUKTE: Name, interne Kennung, Beschreibung */
var dxGroups=[
{name:'Basisfahrzeug',items:[['MAN TGE','man','Basisfahrzeug für den modularen Ausbau'],['Mercedes-Benz Sprinter','sprinter','Alternative Fahrzeugbasis'],['Vorhandenes Fahrzeug','existing','Ausbau eines vorhandenen Fahrzeugs']]},
{name:'Innenraum',items:[['DAEXBO Van Basispaket','basic','Gefilzte Verkleidung, Bodenbelag sowie Airlineschienen an Seitenwänden und Decke'],['Gefilzte Verkleidung','felt','Verkleidung des Laderaums'],['Bodenbelag','floor','Robuster Boden für den Van'],['Airlineschienen Seitenwand','rails-side','Flexible Ladungssicherung'],['Airlineschienen Decke','rails-ceiling','Zusätzliche Befestigungsmöglichkeiten'],['Bodenschienen','rails-floor','Schienensystem im Fahrzeugboden'],['Seitenfenster','window','Fenster für den Laderaum'],['Dachhaube','roof','Licht und Belüftung']]},
{name:'Module & Stauraum',items:[['DAEXBO Stauboxen','boxes','Modularer Stauraum'],['Tablarauszug','drawer','Ausziehbares Staumodul'],['Hängetaschen C-/D-Säule','bags','Seitlicher Stauraum'],['Sperrstange','bar','Variable Ladungssicherung']]},
{name:'Küche & Wasser',items:[['Küchenmodul','kitchen','Modulare Koch- und Staulösung'],['BOXIO Cook','cook','Mobiles Kochsystem'],['BOXIO Wash','wash','Mobile Waschlösung'],['Wassersystem','water','Wasserversorgung im Fahrzeug']]},
{name:'Schlafen & Sitzen',items:[['Freitragendes Bett','bed','Schlafsystem im Laderaum'],['DAEXBO Matratze','mattress','Passende Schlafauflage'],['Zusatzsitz','seat','Zusätzliche Sitzmöglichkeit']]},
{name:'Technik & Zubehör',items:[['Autoterm 2D Standheizung','heater','Diesel-Luftheizung'],['Stromversorgung','power','Energieversorgung für Verbraucher'],['LED-Beleuchtung','lights','Laderaumbeleuchtung'],['Clesana C1','toilet','Mobile Sanitärlösung']]}
];

/* PREISE: Bruttopreise als Zahl ohne Eurozeichen. Beispiel: 'basic': 2490, */
var dxPrices = {
  'boxes': 299
};

/* PRODUKTBILDER */
var dxImages = {
  'cook': 'https://raw.githubusercontent.com/DaemmlerManufaktur/daexbo-konfigurator/main/Boxiokoch.png',
  'bags': 'https://raw.githubusercontent.com/DaemmlerManufaktur/daexbo-konfigurator/main/DaexboTasche.png',
  'boxes': 'https://raw.githubusercontent.com/DaemmlerManufaktur/daexbo-konfigurator/main/Daexbobox.png',
  'mattress': 'https://raw.githubusercontent.com/DaemmlerManufaktur/daexbo-konfigurator/main/Daexbomatratze.png'
};

/* PAKETE: Die hier genannten Einzelmodule sind im Paketpreis enthalten. */
var dxPackages = {
  'basic': ['felt','floor','rails-side','rails-ceiling']
};

var dxSelected={};
var dxCurrent=0;
function dxEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function dxMoney(n){return Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});}
function dxHasPrice(id){return typeof dxPrices[id]==='number' && Number.isFinite(dxPrices[id]);}
function dxIncludedBy(id){for(var pkg in dxPackages){if(dxSelected[pkg] && dxPackages[pkg].indexOf(id)!==-1)return pkg;}return null;}
function dxFindName(id){for(var g=0;g<dxGroups.length;g++){for(var i=0;i<dxGroups[g].items.length;i++){var item=dxGroups[g].items[i];if(item[1]===id)return item[0];}}return id;}
function dxChoose(id){if(dxIncludedBy(id))return;dxSelected[id]=!dxSelected[id];dxRender();}
function dxStep(delta){dxCurrent=Math.max(0,Math.min(dxGroups.length-1,dxCurrent+delta));dxRender();}
function dxGo(n){dxCurrent=n;dxRender();}
function dxGetSummary(){
 var entries=[],total=0,unknown=0;
 for(var g=0;g<dxGroups.length;g++){
  for(var i=0;i<dxGroups[g].items.length;i++){
   var item=dxGroups[g].items[i],id=item[1];
   if(!dxSelected[id] || dxIncludedBy(id))continue;
   var priced=dxHasPrice(id),price=priced?dxPrices[id]:null;
   entries.push({id:id,name:item[0],price:price});
   if(priced)total+=price;else unknown++;
  }
 }
 return {entries:entries,total:total,unknown:unknown};
}
function dxRender(){
 var nav=document.getElementById('dx-nav'),items=document.getElementById('dx-items'),heading=document.getElementById('dx-heading');
 if(!nav||!items||!heading)return;
 var n='';
 for(var g=0;g<dxGroups.length;g++){
  n+='<button type="button" class="'+(g===dxCurrent?'dx-active':'')+'" onclick="dxGo('+g+')">'+(g+1)+'. '+dxEsc(dxGroups[g].name)+'</button>';
 }
 nav.innerHTML=n;
 heading.textContent=dxGroups[dxCurrent].name;
 var h='',a=dxGroups[dxCurrent].items;
 for(var i=0;i<a.length;i++){
  var item=a[i],id=item[1],img=dxImages[id],included=dxIncludedBy(id),priced=dxHasPrice(id),isPackage=!!dxPackages[id];
  var priceText=included?'Im Basispaket enthalten':(priced?dxMoney(dxPrices[id])+' <small>inkl. MwSt.</small>':'Preis auf Anfrage');
  h+='<div class="dx-card'+(isPackage?' dx-package':'')+'"><div class="dx-thumb">'+(img?'<img src="'+dxEsc(img)+'" alt="'+dxEsc(item[0])+'">':'Produktbild folgt')+'</div><h4>'+dxEsc(item[0])+'</h4><p>'+dxEsc(item[2])+'</p>';
  if(isPackage){h+='<strong style="font-size:13px">Im Paket enthalten:</strong><ul class="dx-package-list">';for(var q=0;q<dxPackages[id].length;q++)h+='<li>'+dxEsc(dxFindName(dxPackages[id][q]))+'</li>';h+='</ul>';}
  h+='<div class="dx-price">'+priceText+'</div>';
  if(included){h+='<button type="button" disabled>Im Basispaket enthalten ✓</button>';}
  else{h+='<button type="button" class="'+(dxSelected[id]?'dx-picked':'')+'" onclick="dxChoose(\''+dxEsc(id)+'\')">'+(dxSelected[id]?'Ausgewählt ✓ – entfernen':'Auswählen')+'</button>';}
  h+='</div>';
 }
 items.innerHTML=h;
 document.getElementById('dx-back').disabled=dxCurrent===0;
 document.getElementById('dx-next').disabled=dxCurrent===dxGroups.length-1;
 var s=dxGetSummary(),list=[];
 for(var j=0;j<s.entries.length;j++){
  var e=s.entries[j];
  list.push('<li>'+dxEsc(e.name)+' – '+(e.price===null?'Preis auf Anfrage':dxMoney(e.price))+'</li>');
  if(dxPackages[e.id]){
   for(var k=0;k<dxPackages[e.id].length;k++)list.push('<li style="list-style-type:circle;color:#607367">'+dxEsc(dxFindName(dxPackages[e.id][k]))+' (enthalten)</li>');
  }
 }
 document.getElementById('dx-summary').innerHTML=list.length?'<ul>'+list.join('')+'</ul>':'Noch keine Auswahl.';
 var totalEl=document.getElementById('dx-total');
 if(!s.entries.length){totalEl.textContent='Noch keine Module ausgewählt.';return;}
 var netto=s.total/1.19,mwst=s.total-netto;
 totalEl.innerHTML='<div class="dx-total-row"><span>Summe netto:</span><span>'+dxMoney(netto)+'</span></div>'+
 '<div class="dx-total-row"><span>Umsatzsteuer (19 %):</span><span>'+dxMoney(mwst)+'</span></div>'+
 '<div class="dx-total-row dx-total-final"><span>'+(s.unknown?'Bekannte Summe brutto:':'Gesamtsumme brutto:')+'</span><span>'+dxMoney(s.total)+'</span></div>'+
 (s.unknown?'<p style="font-size:12px;color:#64756a">Zusätzlich '+s.unknown+' Position(en) auf Anfrage, nicht in der Summe enthalten. Die endgültige Gesamtsumme steht noch nicht fest.</p>':'');
}
function dxMail(){
 var s=dxGetSummary();
 if(!s.entries.length){alert('Bitte wähle zuerst mindestens ein Modul aus.');return;}
 var lines=['DAEXBO Van – Konfigurationsanfrage',''];
 for(var i=0;i<s.entries.length;i++){
  var e=s.entries[i];
  lines.push('- '+e.name+' ('+(e.price===null?'Preis auf Anfrage':dxMoney(e.price)+' inkl. MwSt.')+')');
  if(dxPackages[e.id])for(var j=0;j<dxPackages[e.id].length;j++)lines.push('    enthalten: '+dxFindName(dxPackages[e.id][j]));
 }
 lines.push('','Summe netto (bekannte Preise): '+dxMoney(s.total/1.19),'Umsatzsteuer (19 %): '+dxMoney(s.total-s.total/1.19),'Summe brutto (bekannte Preise): '+dxMoney(s.total));
 if(s.unknown)lines.push(s.unknown+' Position(en) auf Anfrage; noch kein endgültiger Gesamtpreis.');
 lines.push('','Bitte senden Sie mir ein Angebot.');
 window.location.href='mailto:kontakt@daemmler.de?subject='+encodeURIComponent('DAEXBO Van Konfigurationsanfrage')+'&body='+encodeURIComponent(lines.join('\n'));
}
dxRender();
</script>
</body>
</html>
